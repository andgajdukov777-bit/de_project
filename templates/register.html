<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация - Конференции.РФ</title>
</head>
<body>
    <h2>Регистрация на портале Конференции.РФ</h2>
    <form method="POST">
        <p>
            <label>Логин (латиница и цифры, от 6 символов):</label><br>
            <input type="text" name="login" required pattern="[A-Za-z0-9]{6,}">
        </p>
        <p>
            <label>Пароль (минимум 8 символов):</label><br>
            <input type="password" name="password" required minlength="8">
        </p>
        <p>
            <label>ФИО (кириллица):</label><br>
            <input type="text" name="full_name" required pattern="[А-Яа-яЁё\s]+">
        </p>
        <p>
            <label>Телефон (формат 8(XXX)XXX-XX-XX):</label><br>
            <input type="text" name="phone" required placeholder="8(999)123-45-67" pattern="8\(\d{3}\)\d{3}-\d{2}-\d{2}">
        </p>
        <p>
            <label>Email:</label><br>
            <input type="email" name="email" required>
        </p>
        <button type="submit">Создать пользователя</button>
    </form>    <br>
    <a href="/login">Уже зарегистрированы? Войти</a>
</body>
</html>
